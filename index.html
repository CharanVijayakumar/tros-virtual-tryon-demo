<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TROS | Virtual Try-On Prototype</title><link rel="stylesheet" href="styles.css"></head>
<body><main><h1>TROS — Virtual Try-On</h1><p>Reconstructed educational browser demonstration (not AR).</p>
<div class="layout"><section aria-label="Preview" class="preview"><div class="head"></div><div class="torso" id="shirt" aria-label="Garment preview"></div><div class="legs"></div></section>
<section><h2>Choose garment colour</h2><label for="colour">Colour</label>
<select id="colour"><option value="#2563eb">Blue</option><option value="#dc2626">Red</option><option value="#16a34a">Green</option><option value="#111827">Black</option></select>
<p id="status" role="status">Showing blue garment</p></section></div></main><script src="app.js"></script></body></html>
